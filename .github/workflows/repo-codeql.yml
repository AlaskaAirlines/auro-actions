name: Code QL

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # auro-actions is workflow and composite-action YAML, so scan it with
      # CodeQL's GitHub Actions language rather than JavaScript.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
